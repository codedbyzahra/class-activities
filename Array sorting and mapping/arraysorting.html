<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>My Playlist Sorter</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    </head>
    <body>
        <h1>My Playlist Sorter</h1>
        <p>Sort and label your playlist according to Javascript array methods.</p>
        <div class="card" mb-4>
            <div class="card-body">
                <div class="class-title">Song Names</div>
                <button class="btn-btn-primary" onclick="sortAZ()">Sorted A to Z</button>
                <button class="btn-btn-primary" onclick="sortZA()">Sorted Z to A</button>
                <div id="nameResult"></div>
            </div>
        </div>

        <div class="card" mb-4>
            <div class="card-body">
                <div class="class-title">Play Counts</div>
                <button class="btn-btn-primary" onclick="sortleast()">Least Played First</button>
                <button class="btn-btn-primary" onclick="sortmost()">Most Played First</button>
                <div id="countResult"></div>
            </div>
        </div>

        <div class="card" mb-4>
            <div class="card-body">
                <div class="class-title">Label every playcounts</div>
                <button class="btn-btn-primary" onclick="addlabelled()">Add Plays Label</button>
                <div id="labelResult"></div>
            </div>
        </div>

        <script>
            var song=["Zoom","Blush","Glow","Rush","Spark"]
            var count=[123,23,4,5,6,7,100]
            document.getElementById("nameResult").innerHTML="Songs:" +song
            document.getElementById("countResult").innerHTML="Plays:" +count
            document.getElementById("labelResult").innerHTML="Press the button to get the result"
            function sortAZ(){
                song.sort()
                document.getElementById("nameResult").innerHTML="Sorted A to Z:" +song;
            }
            function sortZA(){
                song.reverse()
                document.getElementById("nameResult").innerHTML="Sorted Z to A:" +song;
            } 
            function sortleast(){
                count.sort(function(a,b){return a-b;})
                document.getElementById("countResult").innerHTML="Least played songs are" +count
            }
            function sortmost(){
                count.sort(function(a,b){return b-a;})
                document.getElementById("countResult").innerHTML="Most played songs are" +count
            }
            function addlabelled(){
                var l= count.map(function(c){return c + "play"})
                document.getElementById("labelResult").innerHTML="Labelled" + l
            }
            
        </script>
    </body>
</html>
