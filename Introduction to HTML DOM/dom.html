<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>My Zoo</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: whitesmoke;
            color: green;
            text-align: center;
            margin-top: 170px;
            margin-bottom: 170px;
        }
        h1{
            color: brown;
        }
        #Zoo{
            background-color: darkgreen;
            border: 2px solid lightbrown;
            color: beige;
            margin: 20px;
            padding: 30px;
        }
        .zone{
            border-radius: 15px;
        }
    </style>
    <body>
        <h1>My Zoo</h1>
        <p>Use Javascript and DOM for this activity.</p>

        <div id="Zoo">
            <div class="zone">Zone 1:<span id="zone1"></span></div>
            <div class="zone">Zone 2:<span id="zone2"></span></div>
            <div class="zone">Zone 3:<span id="zone3"></span></div>
            <div class="zone">Zone 4:<span id="zone4"></span></div>
            <div class="zone">Total Animals<span id="total"></span></div>
        </div>
        <button onclick="openzoo()">Open the Zoo</button>
        <p id="zoo-status"></p>
        <script>
           function openzoo(){
            document.getElementById("zone1").innerHTML="Lion"
            document.getElementById("zone2").innerHTML="Snake"
            document.getElementById("zone3").innerHTML="Deer"
            document.getElementById("zone4").innerHTML="Elephant"
            document.getElementById("total").innerHTML="4"
           document.getElementById("Zoo").style.backgroundColor="lightgreen"
           document.getElementById("zoo-status").innerHTML=document.title + "is now open";
           }
        </script>
    </body>
</html>
