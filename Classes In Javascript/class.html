<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Classes In Javascript</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
     <h1>Planet Cards</h1>
     <p> Use a Javascript card to build planet cards</p>
     <button onclick="showplanets()">Show Planets</button>
     <div class="cards">
        <div id="card1"></div>
        <div id="card2"></div>
        <div id="card3"></div>
     </div>
        <script>
            class planet{
                constructor(name,fact,size){
                    this.name=name
                    this.fact=fact
                    this.size=size
                }
                describe(){
                    return this.name+ ":"+ this.fact+ ":"+ this.size;
                }
            }
            function showplanets(){
                let earth=new planet("Earth","here we live","unlimited")
                let moon=new planet("moon","mostly rock", "unlimited")
                let uranus=new planet("uranus","blue one",3000)
            document.getElementById("card1").innerHTML="<div class='card'><div class='planet-earth'>"+ earth.name+"</div>"+
            "<div class='planet-fact'>"+ earth.describe()+"</div></div>";
            document.getElementById("card2").innerHTML="<div class='card'><div class='planet-moon'>"+ moon.name+"</div>"+
            "<div class='planet-fact'>"+ moon.describe()+"</div></div>";
            document.getElementById("card3").innerHTML="<div class='card'><div class='planet-uranus'>"+ uranus.name+"</div>"+
            "<div class='planet-fact'>"+ uranus.describe()+"</div></div>";
            }
        </script>
    </body>
</html>
