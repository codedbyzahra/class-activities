    <body>
        <h1>Functions in Javascript</h1>
        <ul>
            <li>Prameters</li>
            <li>Return</li>
            <li>Function Calling</li>
        </ul>
        <button onclick="counting()">CLICK</button>
        <p id="d"></p>
        <button onclick="result(10,2)">BLO UP</button>
        <p id="c"></p>
        <script>
            document.write("Function there Calling you")
            function counting (){
                a=9
                b=10
                document.getElementById("d").innerHTML=a*b;
            }
            function result (a,c){
                document.getElementById("c").innerHTML=a*c;
            }
        </script>
    </body>
