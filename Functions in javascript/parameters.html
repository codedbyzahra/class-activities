<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Functions In Javascript 2</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        <h2>Calculator</h2>
        <button onclick="add()">Add</button>
        <button onclick="subtract(10,5)">Subtract</button>
        <button onclick="multiply(10,5)">Multiply</button>
        <button onclick="divide()">Divide</button>
        <script>
            function add(){
                a=10
                b=5
                c=a+b
                alert("Result ="+ c);
            }
            function subtract(a,b){
                c=a-b;
                alert("Result =" + c);
            }
            function multiply(a,b){
                c=a*b;
                alert("Result="+ c)
            }
            function divide(){
                a=60
                b=2
                c=a/b
                alert("Result=" +c);
            }
        </script>
    </body>
</html>
