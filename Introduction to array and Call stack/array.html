    <body>
        
        <script>
            var students=[
                "zahra","sara","najam","nimra","aqsa"
            ]
            document.write(students[0]+"<br>");
            document.write(students[2]+ "<br>");
            document.write(students[3]+"<br>");

            var fruits=[
                "mango","apple","banana","strawberry"
            ]
            document.write("<br>")
            document.write(fruits+"<br>")
            document.write(fruits.join("+"))
            fruits.pop()
            document.write("<br>")
            document.write("pop"+fruits)
            function add (a,b){
                return a+b;
            }
            function average(a,b){
            return add (a,b)/2;
            }
            let result=average(10,15)
            document.write("<br>"+result)
        </script>
