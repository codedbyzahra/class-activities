<!DOCTYPE html>
<html>
    <head>
        <title>forms in html</title>
    </head>
    <body>
        <h1>form for pateint</h1>
        <p>kindly fill this form</p>
        <form>
            <fieldset>
                <legend>Personal Details</legend>
                <label>Your name:</label>
                <input type="text" placeholder="Write your name">
                <label>Patient ID</label>
                <input type="password" placeholder="Your private ID">
                <label>Date of birth</label>
                <input type="Date"> <br>
            </fieldset>
            <fieldset>
                <legend>Your Visit</legend>
                <label>Choose your doctor</label>
                <select>
                    <option>Dr.Lee</option>
                    <option>Dr.Zarmala</option>
                    <option>Dr.Arham</option>
                </select> <br>
                <label>Why you're visiting</label>
                <input type="radio">Fever
                <input type="radio">Headache
                <input type="radio">Sore throat
            </fieldset>
            <fieldset>
                <legend>Choose your Day</legend>
                <label>Which day would you choose</label>
                <input type="checkbox">Monday
                <input type="checkbox">Tuesday
                <input type="checkbox">Wednesday
                <input type="checkbox">Thursady
                <input type="checkbox">Saturday
            </fieldset>
        </form>
        <button type="submit form">Submit my form</button>
    </body>
</html>
